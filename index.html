<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-white border-b">
        <div class="max-w-6xl mx-auto px-6 py-5 flex flex-col md:flex-row
                    justify-between items-center gap-4">

            <div>
                <h1 class="text-2xl font-bold text-blue-700">
                    Campus Lost & Found
                </h1>
                <p class="text-sm text-gray-500">
                    Helping students find what they lost
                </p>
            </div>

            <button onclick="scrollToReport()"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg
                       hover:bg-blue-700">
                Report Item
            </button>
        </div>
    </header>


    <!-- Home -->
    <section class="max-w-6xl mx-auto px-6 py-10 text-center">
        <h2 class="text-3xl md:text-4xl font-bold mb-3">
            Lost Something on Campus?
        </h2>

        <p class="text-gray-600 mb-7">
            Search lost and found items and reconnect with your belongings.
        </p>

        <!-- Search -->
        <div class="max-w-xl mx-auto">
            <input
                type="text"
                id="searchInput"
                placeholder="Search item e.g. Calculator, ID Card..."
                class="w-full border border-gray-300 rounded-lg px-4 py-3
                       focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>
    </section>


    <!-- Items -->
    <section class="max-w-6xl mx-auto px-6 pb-12">

        <div class="flex flex-col md:flex-row justify-between
                    items-center gap-4 mb-6">

            <h2 class="text-2xl font-bold">Campus Items</h2>

            <select id="categoryFilter"
                class="border border-gray-300 rounded-lg px-4 py-2 bg-white">

                <option value="all">All Categories</option>
                <option value="Books">Books</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Documents">Documents</option>
                <option value="Others">Others</option>
            </select>
        </div>


        <!-- Cards -->
        <div id="itemsContainer"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

    </section>


    <!-- Report Item -->
    <section id="reportSection"
        class="bg-white border-t py-10">

        <div class="max-w-xl mx-auto px-6">

            <h2 class="text-2xl font-bold text-center mb-2">
                Report a Lost / Found Item
            </h2>

            <p class="text-center text-gray-500 mb-6">
                Add basic details to help other students.
            </p>

            <form id="reportForm" class="space-y-4">

                <input
                    id="itemName"
                    type="text"
                    placeholder="Item Name"
                    class="w-full border rounded-lg px-4 py-3"
                    required
                >

                <select
                    id="itemCategory"
                    class="w-full border rounded-lg px-4 py-3"
                    required>

                    <option value="">Select Category</option>
                    <option value="Books">Books</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Documents">Documents</option>
                    <option value="Others">Others</option>
                </select>

                <select
                    id="itemStatus"
                    class="w-full border rounded-lg px-4 py-3"
                    required>

                    <option value="">Select Status</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>

                <input
                    id="itemLocation"
                    type="text"
                    placeholder="Location"
                    class="w-full border rounded-lg px-4 py-3"
                    required
                >

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg
                           hover:bg-blue-700">
                    Submit Report
                </button>

            </form>

            <p id="successMessage"
               class="text-green-600 text-center mt-4 hidden">
                Item reported successfully!
            </p>

        </div>
    </section>


    <!-- Footer -->
    <footer class="bg-gray-100 text-center py-5 text-sm text-gray-500">
        © 2026 Campus Lost & Found Portal
    </footer>


    <script src="script.js"></script>
</body>
</html>
